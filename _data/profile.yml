short_bio: >-
  <p>
  I am a PhD candidate at the Department of Political Science at the University of Gothenburg. 
  <p>
 My research focuses on external support for democratization and state-building in fragile and conflict-affected contexts. 
 I examine how political violence and the legacies of war shape these processes, and how they influence the effectiveness of international democracy and state-building interventions. 
 More broadly, my work aims to critically evaluates external efforts to promote democracy and state-building, with particular attention to recipient countries' agency and context-specific needs. 
  </p>
 In my dissertation, I study the effectiveness of democracy aid in countries recovering from war. 
 I investigate the conditions under which democracy aid can support post-conflict democratization and how its impact is shaped by conflict dynamics, state capacity, and aid design. 
 My research combines quantitative methods, including statistical analyses and conjoint survey experiments, with qualitative interviews with practitioners working in international democracy assistance. 

