short_bio: >-
  <p>
    I am a PhD student at the Department of Political Science at the University of Gothenburg. 
  <p>
    My research interests include democratization, aid effectiveness and post-conflict state-building. 
  </p>
  In my dissertation project, I examine the effectiveness of democracy aid to recipient countries recovering from war. In particular, I explore under which conditions democracy aid can facilitate post-conflict democratization and how factors such as conflict dynamics, recipient state capacity and the aid's design shape the impact of post-conflict democracy aid. 

