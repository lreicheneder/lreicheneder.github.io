short_bio: >-
  <p>
  I am a PhD candidate at the Department of Political Science at the University of Gothenburg. 
  </p>
  
  <p>
  My research focuses on external support for democratization and state-building in fragile and conflict-affected contexts. 
  I examine how political violence and the legacies of war shape these processes, and how they influence the effectiveness of international democracy and state-building interventions. 
  More broadly, my work critically evaluates external efforts to promote democracy and state-building, with particular attention to recipient countries' agency and context-specific needs. 
  </p>
  
  <p>
  In my dissertation, I investigate the conditions under which democracy aid promotes democratization after civil war. 
  Using statistical analyses, conjoint survey experiments, and interviews with practitioners, I examine how conflict dynamics, state capacity, and aid design influence aid effectiveness.
  </p>

  <p>
   Between August and December 2026, I am a visiting scholar at the <a href="https://diplomacy.nccu.edu.tw/eng/PageFront" target="_blank">Department of Diplomacy at National Chengchi University</a> in Taipei, supported by the <a href="https://taiwanfellowship.ncl.edu.tw/eng/scholar_detail.aspx?sn=1351436" target="_blank">Taiwan Fellowship</a>.
  </p>

